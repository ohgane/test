<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMR helium level monitor (JEOL500new)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 64rem; }
  h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
  #status { margin: .2rem 0 .6rem; color: #444; }
  .controls { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .5rem; }
  button { padding: .35rem .8rem; font-size: .95rem; cursor: pointer; }
  #plot { width: 100%; height: 480px; }
  #error { color: #b00020; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    body { background: #181818; color: #ddd; } #status { color: #aaa; }
    button { background: #333; color: #ddd; border: 1px solid #666; }
  }
</style>
</head>
<body>
<h1>NMR helium level monitor — JEOL500new</h1>
<div id="status">読み込み中…</div>
<div id="error"></div>
<div class="controls">
  <button id="prev">◀ 1か月前へ</button>
  <button id="next">1か月後へ ▶</button>
  <button id="r1">直近1か月</button>
  <button id="r3">直近3か月</button>
  <button id="rall">全期間</button>
</div>
<div id="plot"></div>

<script>
// ===== 設定 =====
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRlDW4Y0mPTCUlcSVl6RPUGUif8avsftIzY-iCiKohSm2Ej-lPMFdYRx8abqZXhsUI3ZPxFnW5SXd8p/pub?gid=1835791458&single=true&output=csv";
const MACHINE = { name: "JEOL500new", col: 5,   // 列番号(0始まり): 0 Timestamp, 1 Name, 2 JEOL400, 3 JEOL500, 4 BrukerAV, 5 JEOL500new
                  threshold: 35, danger: 0, ymin: 0 };
const DEFAULT_DAYS = 30;     // 初期表示:データ最終日からさかのぼる日数
const FUTURE_DAYS  = 7;      // 右側の余白(日)
const DAY = 86400000;

const $ = id => document.getElementById(id);

// ===== CSVパーサ(引用符対応) =====
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}

// "12/30/2021 6:03:20"(m/d/Y)または "2021/12/30 6:03:20"(Y/m/d)→ Date(ローカル時刻)
function parseTimestamp(s) {
  const m = /^(\d{1,4})\/(\d{1,2})\/(\d{1,4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/.exec((s || "").trim());
  if (!m) return null;
  const [a, b, c] = [+m[1], +m[2], +m[3]];
  const [y, mo, d] = a > 31 ? [a, b, c] : [c, a, b];
  return new Date(y, mo - 1, d, +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
}

// Date → "YYYY-MM-DD HH:MM:SS"(Plotlyに渡す文字列。タイムゾーンずれを避けるため手で整形)
const p2 = n => String(n).padStart(2, "0");
const toStr = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
// Plotlyのrange文字列 → Date(小数秒は切り捨て)
function fromStr(s) {
  s = String(s).replace(" ", "T").slice(0, 19);
  if (s.length === 10) s += "T00:00:00";
  return new Date(s);
}

let dataMin, dataMax;   // データの最古・最新

function setRange(start, end) {
  Plotly.relayout("plot", { "xaxis.range": [toStr(start), toStr(end)] });
}
function currentRange() {
  const r = $("plot")._fullLayout.xaxis.range;
  return [fromStr(r[0]), fromStr(r[1])];
}
function shiftMonth(dir) {                       // dir: -1(過去へ) / +1(未来へ)
  const [s, e] = currentRange();
  const w = e - s;
  const ns = new Date(s.getTime() + dir * 30 * DAY);
  setRange(ns, new Date(ns.getTime() + w));
}
function lastNDays(n) {
  const end = new Date(dataMax.getTime() + FUTURE_DAYS * DAY);
  setRange(new Date(dataMax.getTime() - n * DAY), end);
}

async function main() {
  try {
    const res = await fetch(CSV_URL + "&t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = parseCSV(await res.text()).slice(1);   // ヘッダ除外

    const pts = [];
    for (const r of rows) {
      const t = parseTimestamp(r[0]);
      const v = parseFloat(r[MACHINE.col]);
      if (t && Number.isFinite(v)) pts.push({ t, v });
    }
    if (!pts.length) throw new Error("有効なデータがありません(列番号 " + MACHINE.col + " を確認)");
    pts.sort((a, b) => a.t - b.t);
    dataMin = pts[0].t; dataMax = pts[pts.length - 1].t;

    const last = pts[pts.length - 1];
    $("status").textContent = `最新: ${last.v}%(${toStr(last.t).slice(0, 16)})/ 全${pts.length}点(${toStr(dataMin).slice(0, 10)} 〜)`;

    const x = pts.map(p => toStr(p.t)), y = pts.map(p => p.v);
    const end0 = new Date(dataMax.getTime() + FUTURE_DAYS * DAY);
    const start0 = new Date(dataMax.getTime() - DEFAULT_DAYS * DAY);

    const trace = { x, y, mode: "markers", type: "scatter", marker: { size: 8, color: "#1f77b4" },
                    hovertemplate: "%{x|%Y-%m-%d %H:%M}<br>%{y}%<extra></extra>" };
    const hline = (yv, color) => ({ type: "line", xref: "paper", x0: 0, x1: 1, yref: "y", y0: yv, y1: yv,
                                    line: { color, width: 1.5 } });
    const layout = {
      title: { text: MACHINE.name },
      xaxis: { type: "date", range: [toStr(start0), toStr(end0)], tickformat: "%y/%b/%d", tickangle: -90,
               dtick: 7 * DAY, showgrid: true },
      yaxis: { title: { text: "Helium level (%)" }, range: [MACHINE.ymin, 105], fixedrange: true },
      shapes: [hline(MACHINE.threshold, "#222"), hline(MACHINE.danger, "red"),
               { type: "line", yref: "paper", y0: 0, y1: 1, xref: "x", x0: toStr(new Date()), x1: toStr(new Date()),
                 line: { color: "#888", width: 1, dash: "dot" } }],     // 今日
      dragmode: "pan", margin: { t: 50, r: 20, b: 90, l: 60 }, showlegend: false
    };
    await Plotly.newPlot("plot", [trace], layout, { responsive: true, displaylogo: false, scrollZoom: false,
                                                    modeBarButtonsToRemove: ["select2d", "lasso2d", "autoScale2d"] });

    $("prev").onclick = () => shiftMonth(-1);
    $("next").onclick = () => shiftMonth(+1);
    $("r1").onclick = () => lastNDays(30);
    $("r3").onclick = () => lastNDays(90);
    $("rall").onclick = () => setRange(new Date(dataMin.getTime() - 3 * DAY), end0);
  } catch (e) {
    $("status").textContent = "";
    $("error").textContent = "データを取得できませんでした: " + e.message;
  }
}
main();
</script>
</body>
</html>
