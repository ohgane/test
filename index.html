<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公開CSV fetch テスト</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 60rem; line-height: 1.5; }
  button { padding: .4rem 1rem; font-size: 1rem; }
  .ok   { color: #0a7a2f; font-weight: 600; }
  .ng   { color: #b00020; font-weight: 600; }
  .warn { color: #8a5a00; }
  pre   { background: #f4f4f4; padding: .8rem; overflow-x: auto; white-space: pre-wrap; }
  table { border-collapse: collapse; margin-top: .5rem; font-size: .9rem; }
  td, th { border: 1px solid #ccc; padding: .2rem .5rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #181818; color: #ddd; }
    pre { background: #262626; }
    td, th { border-color: #555; }
    .ok { color: #5fd38a; } .ng { color: #ff7a8a; } .warn { color: #e0b050; }
  }
</style>
</head>
<body>
<h1>Googleシート公開CSV:ブラウザからのfetchテスト</h1>
<p>このページを開いた場所(<code id="origin"></code>)から、公開CSVを <code>fetch()</code> で取得できるか(CORSが許可されているか)を判定します。</p>
<p><button id="run">再テスト</button></p>
<div id="verdict"></div>
<pre id="log"></pre>
<div id="preview"></div>

<script>
// ★ HeモニターのGoogleシート公開CSV(Rmdと同じURL)
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRlDW4Y0mPTCUlcSVl6RPUGUif8avsftIzY-iCiKohSm2Ej-lPMFdYRx8abqZXhsUI3ZPxFnW5SXd8p/pub?gid=1835791458&single=true&output=csv";

const $ = id => document.getElementById(id);
$("origin").textContent = location.origin === "null" ? "file:// (origin: null)" : location.origin;

// 引用符付きフィールドに対応した最小限のCSVパーサ
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}

// "12/30/2021 6:03:20" (m/d/Y) または "2021/12/30 6:03:20" (Y/m/d) → Date
function parseTimestamp(s) {
  const m = /^(\d{1,4})\/(\d{1,2})\/(\d{1,4})/.exec(s || "");
  if (!m) return null;
  const [a, b, c] = [+m[1], +m[2], +m[3]];
  return a > 31 ? new Date(a, b - 1, c) : new Date(c, a - 1, b);
}

const fmt = d => d ? d.toISOString().slice(0, 10) : "—";

async function run() {
  $("verdict").innerHTML = ""; $("log").textContent = ""; $("preview").innerHTML = "";
  const log = m => { $("log").textContent += m + "\n"; };
  const url = CSV_URL + "&t=" + Date.now();   // キャッシュ回避
  log("GET " + CSV_URL);
  try {
    const t0 = performance.now();
    const res = await fetch(url, { cache: "no-store" });
    const dt = Math.round(performance.now() - t0);
    log(`status: ${res.status} ${res.statusText}  (${dt} ms)`);
    log(`redirected: ${res.redirected}`);
    log(`final URL host: ${new URL(res.url).host}`);
    log(`content-type: ${res.headers.get("content-type")}`);
    if (!res.ok) throw new Error("HTTP " + res.status);

    const text = await res.text();
    const rows = parseCSV(text).filter(r => r.length > 1 || (r[0] || "") !== "");
    const header = rows[0], body = rows.slice(1);
    log(`rows (excluding header): ${body.length}`);
    log(`columns: ${JSON.stringify(header)}`);

    const dates = body.map(r => parseTimestamp(r[0])).filter(Boolean);
    const bad = body.length - dates.length;
    log(`timestamp parse: ${dates.length} ok, ${bad} failed`);
    if (dates.length) {
      log(`date range: ${fmt(new Date(Math.min(...dates)))} → ${fmt(new Date(Math.max(...dates)))}`);
    }
    // 装置列(3列目以降)ごとの有効データ数
    const counts = header.slice(2).map((h, i) =>
      `${h}: ${body.filter(r => r[i + 2] !== undefined && r[i + 2].trim() !== "").length}`);
    log("non-empty values per column (col 3+): " + counts.join(" / "));

    // 末尾5行のプレビュー
    const last = body.slice(-5);
    let html = "<h3>末尾5行</h3><table><tr>" + header.map(h => `<th>${h}</th>`).join("") + "</tr>";
    for (const r of last) html += "<tr>" + header.map((_, i) => `<td>${(r[i] ?? "")}</td>`).join("") + "</tr>";
    $("preview").innerHTML = html + "</table>";

    $("verdict").innerHTML = '<p class="ok">✔ 成功:このオリジンからfetchでき、CSVを取得・パースできました(CORS許可)。</p>';
  } catch (e) {
    log(`error: ${e.name}: ${e.message}`);
    // 切り分け: no-cors モードはCORSに関係なく「届いたか」だけ分かる(中身は読めない=opaque)
    let probe;
    try {
      const r2 = await fetch(CSV_URL + "&t=" + Date.now(), { mode: "no-cors", cache: "no-store" });
      probe = `no-cors probe: 到達OK (type=${r2.type}) → サーバーには届いている`;
      log(probe);
      $("verdict").innerHTML =
        '<p class="ng">✘ 通常のfetchは失敗、no-corsは到達:原因はCORS(応答を読むことをブラウザが禁止)と判断できます。</p>' +
        '<p class="warn">ただし file:// で開いている場合は、file://起因の制限の可能性も残ります。' +
        '同じ結果をGitHub Pages等のhttps環境でも確認してください。</p>';
    } catch (e2) {
      log(`no-cors probe: 失敗 (${e2.name}: ${e2.message}) → ネットワーク/ブラウザ設定側の問題の可能性`);
      $("verdict").innerHTML =
        '<p class="ng">✘ no-corsでも失敗:CORS以前に、通信自体がブロックされている可能性があります。</p>' +
        '<p class="warn">広告・トラッキングブロッカー、VPN、セキュリティソフト、file://の制限を確認してください。' +
        '拡張機能を無効にしたウィンドウ(Safariならプライベートウィンドウ)で再試験を。</p>';
    }
  }
}
$("run").addEventListener("click", run);
run();
</script>
</body>
</html>
